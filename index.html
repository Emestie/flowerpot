<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="manifest" href="./manifest.json" />
        <script>
            // Prevent "flashbang" — apply dark theme before React renders
            (function () {
                try {
                    var raw = localStorage.getItem("@settings");
                    if (raw) {
                        var data = JSON.parse(raw);
                        var settingsStr = data["flowerpot"];
                        if (settingsStr) {
                            var settings = JSON.parse(settingsStr);
                            var theme = settings.theme;
                            var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
                            if (isDark) {
                                document.documentElement.classList.add("FlowerpotDarkTheme");
                                document.documentElement.style.backgroundColor = "#1b1c1d";
                                var meta = document.getElementById("theme-color");
                                if (meta) meta.setAttribute("content", "#1b1c1d");
                            }
                        }
                    }
                } catch (e) {
                    // ignore parse errors
                }

                // Fallback for first-time visitors with no saved settings
                // but OS in dark mode — the default theme is "system"
                if (!document.documentElement.classList.contains("FlowerpotDarkTheme") && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    document.documentElement.classList.add("FlowerpotDarkTheme");
                    document.documentElement.style.backgroundColor = "#1b1c1d";
                    var meta = document.getElementById("theme-color");
                    if (meta) meta.setAttribute("content", "#1b1c1d");
                }
            })();
        </script>
        <meta name="theme-color" content="#000000" id="theme-color" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Flowerpot" />
        <link rel="apple-touch-icon" sizes="256x256" href="./icons/flower-f-256.png" />
        <link rel="icon" href="./favicon.ico" type="image/x-icon" />
        <meta name="google" content="notranslate" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <title>Flowerpot</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
